name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - name: Adversarial security suite
        run: npm run test:adversarial
      - name: Worker and persistence chaos suite
        run: npm run test:chaos
      - run: npm run build
      - name: Kernel protocol smoke
        if: runner.os == 'Linux'
        run: |
          python3 python/kernel_server.py <<'EOF2' | tee /tmp/kernel.jsonl
          {"type":"execute","id":"1","code":"x=40\nx+2"}
          {"type":"shutdown","id":"2"}
          EOF2
          grep -q '"result": "42"' /tmp/kernel.jsonl

  canvas-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @haf/engine
      - run: npm run build -w @haf/canvas-web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/canvas-web
      - name: Run Canvas E2E tests
        run: npx playwright test
        working-directory: apps/canvas-web
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/canvas-web/playwright-report/
          retention-days: 7
